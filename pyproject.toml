[project]
name = "teiko-technical"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
authors = [
    { name = "Weaver Goldman", email = "we.goldm@gmail.com" }
]
requires-python = ">=3.13"
dependencies = [
    "altair>=6.3.0",
    "marimo>=0.25.0",
    "numpy>=2.5.3",
    "pandas>=3.0.6",
    "scikit-learn>=1.9.1",
    "scipy>=1.18.1",
]

[dependency-groups]
dev = [
    "pyrefly>=1.3.1",
    "ruff>=0.16.9",
]

[tool.ruff]
line-length = 88
target-version = "py313"

[tool.ruff.lint]
select = [
    "E",   # pycodestyle errors
    "W",   # pycodestyle warnings
    "F",   # pyflakes
    "I",   # isort
    "B",   # flake8-bugbear
    "UP",  # pyupgrade
    "SIM", # flake8-simplify
]

[tool.pyrefly]
project-includes = ["**/*.py"]
project-excludes = [".venv/**"]
